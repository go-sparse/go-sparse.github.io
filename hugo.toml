baseURL = 'https://go-sparse.github.io/'
locale  = 'en-us'
title   = 'go-sparse'
# No theme -- the layout is the go-* family template, taken from the
# go-fleettools/landingkit Hugo module imported below: one self-contained
# layouts/index.html, and the shared partials (styles.html, theme-toggle.html,
# fork-ribbon.html, icons/) from the module.

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params]
  description = "go-sparse: sparse matrices, fill-reducing orderings and iterative solvers in pure Go (CGO=0) on go-ndarray, following scipy.sparse.linalg and tested against recorded SciPy answers."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
# A status says "released vX.Y.Z" only when a tag exists; otherwise
# "in development" and the pull request that matters.
# sparse: tag v0.2.0 exists (checked with gh api repos/go-sparse/sparse/tags).
[[params.repos]]
  name  = "sparse"
  kind  = "library · released v0.2.0"
  href  = "https://github.com/go-sparse/sparse"
  blurb = "Released v0.2.0. COO, CSR, CSC and DOK matrices over float64 and complex128, Matrix Market I/O, the RCM, AMD and COLAMD orderings, a sparse LDLᵀ for quasi-definite matrices (a port of QDLDL), and the iterative solvers CG, GMRES, BiCGSTAB, MINRES, LSQR and LSMR with Jacobi, SSOR, IC0, ILU0 and ILUT preconditioners, following <code>scipy.sparse.linalg</code>."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-sparse.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): one section per library, made of its own README and what it verifies and measures. <a href=\"https://github.com/go-sparse/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-sparse/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cards of #exact and their count come from this list. Each statement is
# from the README of the library it names (sparse, v0.2.0).
[[params.checks]]
  name = "Iteration counts equal SciPy's"
  what = "CG, GMRES, MINRES, LSQR and LSMR take the same number of iterations as SciPy 1.18.1 on the committed suite; BiCGSTAB agrees within a few iterations. The stopping rule, `rtol`, `maxiter` and `info` follow `scipy.sparse.linalg`. (sparse)"
[[params.checks]]
  name = "Orderings measured by fill"
  what = "AMD Cholesky fill is within 1% of SuiteSparse AMD, COLAMD LU fill within 4% of SuperLU's COLAMD, and RCM bandwidth equals SciPy's. Tie-breaking differs, so permutations differ; quality is compared by fill. (sparse)"
[[params.checks]]
  name = "Faster than SciPy on one core"
  what = "SpMV, CG and GMRES(30) on 2-D Laplacians of 1.1e5 and 1e6 nonzeros take 0.56 to 0.98 of SciPy's time (Go time / SciPy time), interleaved on one core, measured on 2026-10-20 at load 5; SpMV is bit-identical to SciPy's `csr_matvec` order. (sparse)"
[[params.checks]]
  name = "Recorded answers, no Python at test time"
  what = "A Go harness drives SciPy over a pipe and records the answers in a committed fixture; the regression tests replay it, so they need neither Python nor network. (sparse)"
[[params.checks]]
  name = "Hostile Matrix Market files"
  what = "`mtx.Read` checks declared sizes before allocating, counts stored values in int64, cuts a gzip bomb off at a byte limit, and has a fuzz target with a committed corpus. (sparse)"
[[params.checks]]
  name = "100% statement coverage"
  what = "`go test -race` with 100% statement coverage over all packages, 386 and the other architectures in CI, and `govulncheck`. (sparse)"

[params.brand]
