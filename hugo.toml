# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 6.47:1, bright on the dark background 7.68:1.
  base = "#a8372c"
  deep = "#66221b"
  bright = "#e88a7a"
  shadow = "rgba(168,55,44,.7)"
  glow = "rgba(168,55,44,.6)"
  wash = "rgba(168,55,44,.10)"
  washDeep = "rgba(102,34,27,.06)"
  chipBg = "#fcf1ef"
  chipBorder = "#f8dcd7"
  chipFg = "#66221b"
  chipBgDark = "rgba(232,138,122,.14)"
  chipBorderDark = "rgba(232,138,122,.32)"
  chipFgDark = "#f2bfb6"
  statsEnd = "#f9e3df"
  bandText = "#fbecea"
